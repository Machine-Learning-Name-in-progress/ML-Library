name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # PyPI trusted publishing

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check tag matches pyproject version
        run: |
          version=$(uv version --short)
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match pyproject version v$version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        run: uv publish
