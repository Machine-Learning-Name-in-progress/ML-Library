name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # So we can run it on the github page

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match pyproject version v$version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv publish
