[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-library"
version = "0.1.0"
description = "A machine learning library built from scratch"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
    "commitizen",
]
